name: Check FlashView

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run check:cloudflare
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Install Firefox for fullscreen compatibility checks
        run: npx playwright install --with-deps firefox
      - name: Firefox presenter — fullscreen pixels and document controls
        run: node --import tsx --test --test-name-pattern="real browser:" tests/browser.smoke.ts
        env:
          FLASHVIEW_BROWSER: firefox
      - name: Browser test — Cloudflare Durable Objects
        run: npm run test:browser
        env:
          FLASHVIEW_BACKEND: cloudflare
      - name: Stage 0 baseline — Node (synthetic 2 MiB)
        run: npm run bench:baseline
        env:
          BENCH_MIB: 2
          BENCH_RUNS: 3
      - name: Stage 0 baseline — Cloudflare (synthetic 2 MiB)
        run: npm run bench:baseline
        env:
          BENCH_MIB: 2
          BENCH_RUNS: 3
          FLASHVIEW_BACKEND: cloudflare
      - name: Stage 1 A/B — fixed concurrency (synthetic slow sender)
        run: npm run bench:baseline
        env:
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_STUDENTS: 1
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_TRANSFER_MODE: fixed
      - name: Stage 1 A/B — adaptive concurrency (same synthetic slow sender)
        run: npm run bench:baseline
        env:
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_STUDENTS: 1
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_TRANSFER_MODE: adaptive
      - name: Stage 1 A/B — Cloudflare fixed concurrency (synthetic slow sender)
        run: npm run bench:baseline
        env:
          FLASHVIEW_BACKEND: cloudflare
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_STUDENTS: 1
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_TRANSFER_MODE: fixed
      - name: Stage 1 A/B — Cloudflare adaptive concurrency (same synthetic slow sender)
        run: npm run bench:baseline
        env:
          FLASHVIEW_BACKEND: cloudflare
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_STUDENTS: 1
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_TRANSFER_MODE: adaptive
      # Phase 1 network-frame A/B: same 4 MiB fixture and slow sender as
      # the existing adaptive 64 KiB reference. Cache format remains 64 KiB.
      - name: Phase 1 packets — Node 128 KiB
        run: npm run bench:baseline
        env:
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_PACKET_KIB: 128
      - name: Phase 1 packets — Node 256 KiB
        run: npm run bench:baseline
        env:
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_PACKET_KIB: 256
      - name: Phase 1 packets — Cloudflare local 128 KiB
        run: npm run bench:baseline
        env:
          FLASHVIEW_BACKEND: cloudflare
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_PACKET_KIB: 128
      - name: Phase 1 packets — Cloudflare local 256 KiB
        run: npm run bench:baseline
        env:
          FLASHVIEW_BACKEND: cloudflare
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_PACKET_KIB: 256
      - name: Upload Phase 1 network-frame comparisons
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashview-network-packet-comparison
          path: test-artifacts/stage0-*-4mib-1students-40ms-adaptive*.json
          if-no-files-found: warn
      # Phase 3 credit-window streaming, opt-in. Compare with the same 4 MiB
      # 40 ms sender-read fixtures and packet=256 range A/B above.
      - name: Phase 3 stream — Node local
        run: npm run bench:baseline
        env:
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_STUDENTS: 1
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_PACKET_KIB: 256
          BENCH_STREAM: 1
      - name: Phase 3 stream — Cloudflare local
        run: npm run bench:baseline
        env:
          FLASHVIEW_BACKEND: cloudflare
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_STUDENTS: 1
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_PACKET_KIB: 256
          BENCH_STREAM: 1
      - name: Upload Phase 3 range-versus-stream comparisons
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashview-streaming-ab
          path: test-artifacts/stage0-*-4mib-1students-40ms-adaptive-packet256kib*.json
          if-no-files-found: warn
      - name: Upload UI reference screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashview-ui-reference
          path: test-artifacts/ui/*.png
          if-no-files-found: warn
      - name: Upload Stage 1 A/B reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashview-stage1-comparison
          path: test-artifacts/stage0-*-4mib-1students-40ms-*.json
          if-no-files-found: warn
      - name: Upload Stage 0 baselines
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashview-stage0-baseline
          path: test-artifacts/stage0-*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flashview-browser-failure
          path: test-artifacts/
          if-no-files-found: ignore
