name: Check FlashView

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run check:cloudflare
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser test — Cloudflare Durable Objects
        run: npm run test:browser
        env:
          FLASHVIEW_BACKEND: cloudflare
      - name: Stage 0 baseline — Node (synthetic 2 MiB)
        run: npm run bench:baseline
        env:
          BENCH_MIB: 2
          BENCH_RUNS: 3
      - name: Stage 0 baseline — Cloudflare (synthetic 2 MiB)
        run: npm run bench:baseline
        env:
          BENCH_MIB: 2
          BENCH_RUNS: 3
          FLASHVIEW_BACKEND: cloudflare
      - name: Stage 1 A/B — fixed concurrency (synthetic slow sender)
        run: npm run bench:baseline
        env:
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_STUDENTS: 1
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_TRANSFER_MODE: fixed
      - name: Stage 1 A/B — adaptive concurrency (same synthetic slow sender)
        run: npm run bench:baseline
        env:
          BENCH_MIB: 4
          BENCH_RUNS: 3
          BENCH_STUDENTS: 1
          BENCH_FILE_READ_DELAY_MS: 40
          BENCH_TRANSFER_MODE: adaptive
      - name: Upload Stage 1 A/B reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashview-stage1-comparison
          path: test-artifacts/stage0-node-4mib-1students-40ms-*.json
          if-no-files-found: warn
      - name: Upload Stage 0 baselines
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashview-stage0-baseline
          path: test-artifacts/stage0-*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flashview-browser-failure
          path: test-artifacts/
          if-no-files-found: ignore
